[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-as-code"
version = "0.1.0"
description = "Write your CV once in YAML, render a clean PDF, and tailor it to any job with AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "markdown-it-py>=3.0",
  "weasyprint>=60",
]
keywords = ["cv", "resume", "yaml", "pdf", "cover-letter", "ai", "llm"]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
cv-as-code = "cv_as_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_as_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
