[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-ai-resume"
version = "0.9.0"
description = "Write your CV once in YAML, render a clean PDF, and tailor it to any job with AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "markdown-it-py>=3.0",
  "weasyprint>=60",
]
keywords = ["cv", "resume", "yaml", "pdf", "cover-letter", "ai", "llm"]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
easy-ai-resume = "easy_ai_resume.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_ai_resume"]

# `easy-ai-resume init` copies these starter files into the user's folder.
[tool.hatch.build.targets.wheel.force-include]
"examples/cv.yaml" = "easy_ai_resume/starter/cv.yaml"
"examples/cover_letter.yaml" = "easy_ai_resume/starter/cover_letter.yaml"
"examples/job.md" = "easy_ai_resume/starter/job.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
