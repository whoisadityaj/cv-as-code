name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for PDF rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: pytest -q

  example:
    # Builds the example PDFs with the action itself, the way users will run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: examples/cv.yaml examples/cover_letter.yaml
          out: output
      - uses: actions/upload-artifact@v4
        with:
          name: example-pdfs
          path: output/*.pdf
