# Copy to .github/workflows/cv.yml in the repo that holds your CV YAML.
# Every push rebuilds your PDFs and attaches them to the workflow run.
name: Build CV

on:
  push:
    paths: ["input/**", ".github/workflows/cv.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: whoisadityaj/easy-ai-resume@v0.9.0
        with:
          files: input/cv.yaml input/cover_letter.yaml
          # theme: modern
          # ats: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: output/*.pdf
